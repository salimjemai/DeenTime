services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deentime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DEENTIME_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/DeenTime.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "${DEENTIME_API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=deentime;Username=postgres;Password=postgres"
      Auth__Issuer: deentime-local
      Auth__Audience: deentime-api
      Auth__SigningKey: "${DEENTIME_AUTH_SIGNING_KEY:?Set DEENTIME_AUTH_SIGNING_KEY or use scripts/start-local.sh}"
      IslamicContent__HadithApiKey: "${DEENTIME_HADITH_API_KEY:-}"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://127.0.0.1:4200"
      Cors__AllowedOrigins__2: "http://127.0.0.1:14200"
      Frontend__PublicBaseUrl: "${DEENTIME_PUBLIC_BASE_URL:-http://127.0.0.1:4200}"
      SuperUser__Email: "admin@deentime.dev"
      SuperUser__Password: "${DEENTIME_SUPERUSER_PASSWORD:?Set DEENTIME_SUPERUSER_PASSWORD or use scripts/start-local.sh}"
      SuperUser__OrgName: "IqamaTime Demo Mosque"
      SuperUser__AddressLine: "14300 Rountree Ranch Lane"
      SuperUser__City: "Austin"
      SuperUser__State: "TX"
      SuperUser__ZipCode: "78717"
      SuperUser__Phone: "4094543454"
      SuperUser__OrgEmail: "admin@deentime.dev"
      SuperUser__WebsiteUrl: "https://deentime.dev"
      SuperUser__Latitude: "30.5119418"
      SuperUser__Longitude: "-97.8177601"
      SuperUser__TimezoneId: "America/Chicago"
      SuperUser__Method: "ISNA"
      SuperUser__JuristicMethodAsr: "Other"
      SuperUser__MinutesAfterZawal: "5"
      SuperUser__MinutesAfterMaghrib: "1"
      SuperUser__KhutbahTimeMinutes: "20"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  uploads:
