# DeenTime staging — OpenLiteSpeed vhost snippet for iqama.momyum.com.
#
# WHY THIS EXISTS
# On OpenLiteSpeed the rewrite [P] flag CANNOT proxy to a bare address like
# http://127.0.0.1:18080/ — that produces a LiteSpeed 500. Proxying requires a
# named External App (extprocessor of type "proxy"). The API listens on
# 127.0.0.1:18080 (systemd --user unit deentime-api).
#
# HOW TO APPLY (needs CyberPanel admin or root — the iqama6368 SSH account
# cannot edit vhost config):
#   CyberPanel -> Websites -> List Websites -> iqama.momyum.com -> Manage ->
#   Configurations -> "vHost Conf". Paste the extprocessor block and the four
#   proxy contexts below into the vhost config, replace the rewrite rules with
#   the corrected set at the bottom, Save, then restart LiteSpeed.
# Root alternative: edit /usr/local/lsws/conf/vhosts/iqama.momyum.com/vhconf.conf
#   and run: /usr/local/lsws/bin/lswsctrl restart

# ── Backend API as a named proxy target ──────────────────────────────────────
extprocessor deentime-api {
  type                    proxy
  address                 127.0.0.1:18080
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

# ── Route API paths to the backend ───────────────────────────────────────────
context /api {
  type                    proxy
  handler                 deentime-api
  addDefaultCharset       off
}
context /health {
  type                    proxy
  handler                 deentime-api
  addDefaultCharset       off
}
context /public {
  type                    proxy
  handler                 deentime-api
  addDefaultCharset       off
}
context /uploads {
  type                    proxy
  handler                 deentime-api
  addDefaultCharset       off
}

# ── SPA fallback (leave the proxied prefixes untouched) ──────────────────────
# The proxy contexts above serve /api, /health, /public, /uploads; the rewrite
# only needs to send real deep-links to index.html. Excluding those prefixes
# keeps the rewrite from swallowing API calls.
rewrite {
  enable                  1
  rules                   <<<END_rules
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/(api|health|public|uploads)(/|$)
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^ /index.html [L]
END_rules
}
