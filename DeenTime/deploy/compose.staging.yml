name: deentime-staging

services:
  api:
    image: ghcr.io/salimjemai/deentime-api:${DEENTIME_IMAGE_TAG:?DEENTIME_IMAGE_TAG is required}
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:18080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - deentime_uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: ghcr.io/salimjemai/deentime-web:${DEENTIME_IMAGE_TAG:?DEENTIME_IMAGE_TAG is required}
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:10080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  deentime_uploads:
