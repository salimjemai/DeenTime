# DeenTime staging — nginx site for the self-hosted srv1 box.
# Install to /etc/nginx/sites-available/deentime and symlink into sites-enabled.
# HTTPS: once a hostname points at the server, set server_name and run
#   certbot --nginx -d <domain> --redirect --hsts
# which appends the listen 443 block and the HTTP->HTTPS redirect.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/deentime;
    index index.html;

    client_max_body_size 20m;

    # API, health checks, public endpoints, and uploaded files -> backend
    location ~ ^/(api|health|public|uploads)(/|$) {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # App shell: never cache, so PWA updates roll out promptly
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /ngsw.json  { add_header Cache-Control "no-store"; }

    # SPA fallback: real files/prerendered routes first, else index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
