name: Cloudflare (masjid site)

# Tests and builds on every pull request. Deploys only when someone runs it by hand
# with deploy = true and the Cloudflare secrets are set (see DeenTime/cloudflare/README.md).
on:
  pull_request:
    paths:
      - 'DeenTime/cloudflare/**'
      - 'DeenTime/frontend/deentime-web/**'
      - 'DeenTime/backend-node/src/domain/**'
      - 'DeenTime/brand.json'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare after the checks pass'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: DeenTime/cloudflare
        run: npm ci
      - name: Install shared calculator dependencies
        working-directory: DeenTime/backend-node
        run: npm ci --ignore-scripts
      - name: Type-check and test the Worker
        working-directory: DeenTime/cloudflare
        run: |
          npm run check
          npm test
      - name: Build the web app for /masjid/
        working-directory: DeenTime/frontend/deentime-web
        run: |
          npm ci
          npm run build -- --configuration cloudflare --base-href /masjid/
          grep -F '<base href="/masjid/">' dist/deentime-web/browser/index.html
      - name: Bundle the Worker (no upload)
        working-directory: DeenTime/cloudflare
        run: |
          node scripts/prepare-assets.mjs
          npx wrangler deploy --dry-run --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: masjid-site
          path: DeenTime/cloudflare/dist-web
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://jemaiinnovations.com/masjid/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: masjid-site
          path: DeenTime/cloudflare/dist-web
      - name: Install
        run: |
          (cd DeenTime/backend-node && npm ci --ignore-scripts)
          (cd DeenTime/cloudflare && npm ci)
      - name: Check credentials and D1 id
        working-directory: DeenTime/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo '::error::Put the real D1 database id in DeenTime/cloudflare/wrangler.jsonc first'; exit 1
          fi
      - name: Apply database migrations
        working-directory: DeenTime/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply deentime --remote
      - name: Deploy the Worker
        working-directory: DeenTime/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
