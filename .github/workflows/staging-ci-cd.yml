name: Build and deploy staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_HOST: 165.227.175.2
  DEPLOY_USER: iqama6368

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Start native PostgreSQL
        run: |
          if ! command -v pg_isready >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql postgresql-client
          fi
          sudo systemctl start postgresql.service
          sudo -u postgres psql --command "ALTER USER postgres WITH PASSWORD 'postgres';"
          pg_isready --host 127.0.0.1 --port 5432

      - name: Test API
        env:
          DEENTIME_TEST_POSTGRES_ADMIN: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false
        run: dotnet test DeenTime/DeenTime.sln --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DeenTime/frontend/deentime-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: DeenTime/frontend/deentime-web
        run: npm ci

      - name: Test frontend
        working-directory: DeenTime/frontend/deentime-web
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend
        working-directory: DeenTime/frontend/deentime-web
        run: |
          npm run build -- --configuration production
          if grep -R -a -q 'localhost:8080' dist/deentime-web/browser; then
            echo 'Production frontend contains a localhost API URL.' >&2
            exit 1
          fi

  deploy:
    name: Deploy iqama.momyum.com
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://iqama.momyum.com
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained API
        run: |
          dotnet publish DeenTime/backend/DeenTime.Api/DeenTime.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output publish/api
          tar -czf "deentime-api-$GITHUB_SHA.tar.gz" -C publish/api .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DeenTime/frontend/deentime-web/package-lock.json

      - name: Build frontend
        working-directory: DeenTime/frontend/deentime-web
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Package frontend
        run: |
          tar -czf "deentime-web-$GITHUB_SHA.tar.gz" \
            -C DeenTime/frontend/deentime-web/dist/deentime-web/browser .

      - name: Configure pinned SSH identity
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '165.227.175.2 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDlGFaTKNS9P8kVfTvBbvBrqDmtxNDDUQoPKGMRjA/G6' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy release to the server
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p "$HOME/deentime/incoming"'
          scp DeenTime/deploy/deploy-staging.sh "$DEPLOY_USER@$DEPLOY_HOST:deentime/deploy-staging.sh"
          scp DeenTime/deploy/deentime-api.service "$DEPLOY_USER@$DEPLOY_HOST:deentime/deentime-api.service"
          scp "deentime-api-$GITHUB_SHA.tar.gz" "deentime-web-$GITHUB_SHA.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:deentime/incoming/"

      - name: Start release and run local health checks
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash \"\$HOME/deentime/deploy-staging.sh\" \"$GITHUB_SHA\""

      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors https://iqama.momyum.com/health/ready
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors https://iqama.momyum.com/api/version
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors https://iqama.momyum.com/ > /dev/null
