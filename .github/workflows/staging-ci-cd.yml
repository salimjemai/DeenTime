name: Build and deploy staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/deentime-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/deentime-web
  DEPLOY_HOST: 165.227.175.2
  DEPLOY_USER: iqama6368

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test API
        run: dotnet test DeenTime/DeenTime.sln --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DeenTime/frontend/deentime-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: DeenTime/frontend/deentime-web
        run: npm ci

      - name: Test frontend
        working-directory: DeenTime/frontend/deentime-web
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend
        working-directory: DeenTime/frontend/deentime-web
        run: npm run build -- --configuration production

  publish:
    name: Publish immutable images
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: DeenTime
          file: DeenTime/backend/DeenTime.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:staging
          cache-from: type=gha,scope=deentime-api
          cache-to: type=gha,mode=max,scope=deentime-api

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: DeenTime/frontend/deentime-web
          file: DeenTime/frontend/deentime-web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:staging
          cache-from: type=gha,scope=deentime-web
          cache-to: type=gha,mode=max,scope=deentime-web

  deploy:
    name: Deploy iqama.momyum.com
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://iqama.momyum.com
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable images onto the runner
        run: |
          docker pull "$API_IMAGE:$GITHUB_SHA"
          docker pull "$WEB_IMAGE:$GITHUB_SHA"

      - name: Configure pinned SSH identity
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '165.227.175.2 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDlGFaTKNS9P8kVfTvBbvBrqDmtxNDDUQoPKGMRjA/G6' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy deployment definition
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p "$HOME/deentime"'
          scp DeenTime/deploy/compose.staging.yml "$DEPLOY_USER@$DEPLOY_HOST:deentime/compose.staging.yml"
          scp DeenTime/deploy/deploy-staging.sh "$DEPLOY_USER@$DEPLOY_HOST:deentime/deploy-staging.sh"

      - name: Transfer images without storing a registry credential on the server
        run: |
          docker save "$API_IMAGE:$GITHUB_SHA" "$WEB_IMAGE:$GITHUB_SHA" \
            | gzip -1 \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" 'gunzip | docker load'

      - name: Start release and run local health checks
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash \"\$HOME/deentime/deploy-staging.sh\" \"$GITHUB_SHA\""

      - name: Verify public HTTPS endpoints
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors https://iqama.momyum.com/health/ready
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors https://iqama.momyum.com/api/version
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors https://iqama.momyum.com/ > /dev/null
