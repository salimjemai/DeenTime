name: Build and deploy staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Self-hosted staging box (srv1, plain Ubuntu + nginx + systemd).
  DEPLOY_HOST: 70.36.101.120
  DEPLOY_USER: root
  DEPLOY_HOST_KEY: 70.36.101.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICOaeiHdbbHIbQTVREHS6Lw76srcYiSbmHHmk5coo2rw
  # Public base URL used for post-deploy verification. Switch to https://<domain>
  # once a hostname points at the server and certbot has issued a certificate.
  STAGING_URL: http://70.36.101.120

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Start native PostgreSQL
        run: |
          if ! command -v pg_isready >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql postgresql-client
          fi
          sudo systemctl start postgresql.service
          sudo -u postgres psql --command "ALTER USER postgres WITH PASSWORD 'postgres';"
          pg_isready --host 127.0.0.1 --port 5432

      - name: Test API
        env:
          DEENTIME_TEST_POSTGRES_ADMIN: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false
        run: dotnet test DeenTime/DeenTime.sln --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DeenTime/frontend/deentime-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: DeenTime/frontend/deentime-web
        run: npm ci

      - name: Test frontend
        working-directory: DeenTime/frontend/deentime-web
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend
        working-directory: DeenTime/frontend/deentime-web
        run: |
          npm run build -- --configuration production
          if grep -R -a -q 'localhost:8080' dist/deentime-web/browser; then
            echo 'Production frontend contains a localhost API URL.' >&2
            exit 1
          fi

  deploy:
    name: Deploy staging (srv1)
    # Deploys are manual only: Actions -> "Build and deploy staging" -> Run workflow.
    # Pushes and pull requests run the tests but never touch the server.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained API
        run: |
          dotnet publish DeenTime/backend/DeenTime.Api/DeenTime.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output publish/api
          tar -czf "deentime-api-$GITHUB_SHA.tar.gz" -C publish/api .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DeenTime/frontend/deentime-web/package-lock.json

      - name: Build frontend
        working-directory: DeenTime/frontend/deentime-web
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Package frontend
        run: |
          tar -czf "deentime-web-$GITHUB_SHA.tar.gz" \
            -C DeenTime/frontend/deentime-web/dist/deentime-web/browser .

      - name: Configure key-authenticated SSH
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$STAGING_SSH_PRIVATE_KEY" ]; then
            echo 'STAGING_SSH_PRIVATE_KEY is missing.' >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host staging
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Copy release to the server
        run: |
          ssh staging 'mkdir -p /opt/deentime/incoming'
          scp DeenTime/deploy/deploy-staging.sh DeenTime/deploy/deentime-api.service staging:/opt/deentime/
          scp "deentime-api-$GITHUB_SHA.tar.gz" "deentime-web-$GITHUB_SHA.tar.gz" staging:/opt/deentime/incoming/

      - name: Start release and run local health checks
        run: ssh staging "bash /opt/deentime/deploy-staging.sh $GITHUB_SHA"

      - name: Verify public endpoints
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors "$STAGING_URL/health/ready"
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors "$STAGING_URL/api/version"
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors "$STAGING_URL/" > /dev/null
